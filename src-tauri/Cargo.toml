[package]
name = "spatt"
description = "SPATT — Signal Programming and Timing Tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# The _lib suffix avoids a name clash with the bin target on Windows (cargo#8519).
name = "spatt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
clap = { workspace = true, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
spatt-server = { path = "../crates/spatt-server" }
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.4"
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "time"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }
winreg = "0.56.0"

[target."cfg(not(windows))".dependencies]
directories.workspace = true
