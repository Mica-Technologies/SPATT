[workspace]
resolver = "2"
members = ["src-tauri", "crates/spatt-server"]

[workspace.package]
# Written by scripts/version.mjs at release time; 0.0.0 marks a local build.
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Mica-Technologies/SPATT"
authors = ["Mica Technologies"]
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
getrandom = "0.4.3"
mime_guess = "2.0.5"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
