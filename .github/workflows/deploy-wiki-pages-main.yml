name: Deploy Wiki (GitHub Pages)

# Publishes docs/ as the SPATT wiki at https://mica-technologies.github.io/SPATT/
#
# ONE-TIME SETUP: Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions".
# Without it this workflow builds cleanly and the deploy step fails with a 404.
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/deploy-wiki-pages-main.yml'
  workflow_dispatch:

# Read the repo, write Pages, and mint the OIDC token deploy-pages exchanges for credentials.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment mid-flight; a half-published site is worse than publishing twice.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation toolchain
        run: python -m pip install -r docs/requirements.txt

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # --strict turns warnings into errors, so a broken link fails here instead of shipping.
      - name: Build with MkDocs
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
